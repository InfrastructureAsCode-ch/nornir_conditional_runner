---
name: test nornir_conditional_runner
on: [push, pull_request]

jobs:
  linters:
    name: linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff
        run: uv run ruff check

      - name: Run ruff format
        run: uv run ruff format --check

      - name: Run mypy
        run: uv run mypy . --pretty --show-error-context

  pytest:
    name: Testing on Python ${{ matrix.python-version }} (${{ matrix.platform }})
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        platform: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Show installed packages
        run: uv pip list

      - name: Show environment info
        run: uv run python -VV

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=nornir_conditional_runner --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report artifact
        if: matrix.platform == 'macos-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  coverage:
    runs-on: macos-latest
    needs: [pytest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download coverage report artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Extract Coverage
        if: runner.os == 'macOS'
        run: |
          pip install lxml
          COVERAGE=$(xmllint --xpath "string(//coverage/@line-rate)" coverage.xml)
          echo "coverage=$COVERAGE" >> $GITHUB_ENV

      - name: Generate Badge
        if: runner.os == 'macOS'
        run: |
          pip install lxml
          COVERAGE=$(xmllint --xpath "string(//coverage/@line-rate)" coverage.xml)
          COVERAGE=$(awk "BEGIN {print $COVERAGE * 100}")
          echo "Extracted Coverage: $COVERAGE%"
          echo "{\"schemaVersion\": 1, \"label\": \"coverage\", \"message\": \"${COVERAGE}%\", \"color\": \"green\"}" > coverage-badge.json
          mkdir -p public
          mv coverage-badge.json public/

      - name: Deploy Badge to GitHub Pages
        if: runner.os == 'macOS'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

  release:
    name: Releasing to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs: [linters, pytest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Build release
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/*