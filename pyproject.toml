[project]
name = "nornir-conditional-runner"
version = "0.2.0"
description = "A Nornir plugin enforcing concurrency limits based on device groups"
readme = "README.md"
authors = [{ name = "simon linder", email = "simon.linder@ost.ch" }]
requires-python = ">=3.8,<4"
dependencies = [
    "nornir>=3,<4",
    "setuptools; python_version >= '3.12'",
]

[project.urls]
Repository = "https://github.com/InfrastructureAsCode-ch/nornir_conditional_runner"

[project.entry-points."nornir.plugins.runners"]
ConditionalRunner = "nornir_conditional_runner.conditional_runner:ConditionalRunner"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]
test = [
    "nornir-rich>=0.2.0,<0.3",
]

[tool.uv]
default-groups = ["dev", "test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nornir_conditional_runner"]

[tool.ruff.lint]
# Enable pycodestyle, pyflakes, pep8-naming and pydocstyle rules.
select = ["E4", "E7", "E9", "F", "N", "D"]
ignore = ["D100"]

[tool.mypy]
python_version = "3.8"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
strict_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
